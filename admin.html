<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard สรุปข้อมูล (Admin)</title>
    
    <!-- นำเข้า Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        h2 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; text-align: center; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; }
        th { background-color: #f1f5f9; color: #334155; font-weight: bold; white-space: nowrap; }
        tr:hover { background-color: #f8fafc; }
        
        .pass { color: #10b981; font-weight: bold; font-size: 16px; }
        .fail { color: #cbd5e1; }
        .redeemed { background-color: #fef3c7; color: #d97706; font-weight: bold; padding: 4px 8px; border-radius: 5px; }
        
        .stat-box { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #3b82f6; color: white; padding: 15px 25px; border-radius: 10px; font-size: 18px; font-weight: bold; }
        .stat-card.success { background: #10b981; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 ระบบจัดการหลังบ้าน (Real-time Dashboard)</h2>
        
        <div class="stat-box">
            <div class="stat-card">ผู้เข้าร่วมทั้งหมด: <span id="totalUsers">0</span> คน</div>
            <div class="stat-card success">แลกรางวัลแล้ว: <span id="totalRedeemed">0</span> คน</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>รหัสสมาชิก</th>
                    <th>ฐาน 1</th><th>ฐาน 2</th><th>ฐาน 3</th><th>ฐาน 4</th><th>ฐาน 5</th>
                    <th>AIX (6)</th><th>ฐาน 7</th><th>ฐาน 8</th><th>ฐาน 9</th><th>ฐาน 10</th>
                    <th>สถานะของรางวัล</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="12">⏳ กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // 🎯 นำ Firebase Config ของคุณมาวางตรงนี้ (ตัวเดียวกับไฟล์ index.html)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAl3zeSfVEFcCzH7f59xI4p2JIGRmKv84Q",
            authDomain: "test-c7a89.firebaseapp.com",
            projectId: "test-c7a89",
            storageBucket: "test-c7a89.firebasestorage.app",
            messagingSenderId: "991568384353",
            appId: "1:991568384353:web:a793fcb490810aac47b520",
            measurementId: "G-R3VS4FMDSX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ฟังก์ชันดึงข้อมูลมาทำเป็นตาราง
        const userRef = db.ref('users');
        userRef.on('value', (snapshot) => {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = ''; // ล้างข้อมูลเก่า
            
            let totalUsers = 0;
            let totalRedeemed = 0;

            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // วนลูปข้อมูลผู้ใช้แต่ละคนมาสร้างแถวตาราง
                for (let userCode in data) {
                    totalUsers++;
                    const user = data[userCode];
                    const tr = document.createElement('tr');
                    
                    // สร้างคอลัมน์รหัสสมาชิก
                    let html = `<td><strong>${userCode}</strong></td>`;
                    
                    // สร้างคอลัมน์ฐาน 1-10
                    for(let i=0; i<10; i++) {
                        const isPassed = user.stations ? user.stations[i] : false;
                        if(isPassed) {
                            html += `<td class="pass">✔️</td>`;
                        } else {
                            html += `<td class="fail">-</td>`;
                        }
                    }

                    // สร้างคอลัมน์สถานะของรางวัล
                    if(user.isRedeemed) {
                        totalRedeemed++;
                        html += `<td><span class="redeemed">🎁 รับแล้ว</span></td>`;
                    } else {
                        html += `<td>-</td>`;
                    }

                    tr.innerHTML = html;
                    tableBody.appendChild(tr);
                }
            } else {
                tableBody.innerHTML = '<tr><td colspan="12">ยังไม่มีข้อมูลผู้เข้าร่วม</td></tr>';
            }

            // อัปเดตตัวเลขสรุปผล
            document.getElementById('totalUsers').innerText = totalUsers;
            document.getElementById('totalRedeemed').innerText = totalRedeemed;
        });
    </script>
</body>
</html>
