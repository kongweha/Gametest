<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบหลังบ้าน (Admin Dashboard)</title>
    <!-- โหลด Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        /* (ใช้ CSS เดิมของคุณได้เลยครับ) */
        body { font-family: sans-serif; background-color: #f1f5f9; padding: 20px; }
        .admin-container { background: white; padding: 30px; border-radius: 15px; max-width: 1000px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .completed { background: #bbf7d0; color: #166534; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>⚙️ ระบบจัดการหลังบ้าน (Firebase Real-time)</h1>
        <button onclick="generateAndUploadCodes()">🔄 สร้าง 500 รหัสขึ้น Firebase</button>
        
        <table id="adminTable">
            <thead>
                <tr>
                    <th>ลำดับ</th>
                    <th>รหัสสมาชิก</th>
                    <th>จำนวนฐานที่ผ่าน</th>
                    <th>สถานะ</th>
                    <th>แลกรางวัล</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAJlt9qKkkUqPrQL7RLoRAPO-ToYwY7Q2o",
          authDomain: "eventstampcard.firebaseapp.com",
          databaseURL: "https://eventstampcard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "eventstampcard",
          storageBucket: "eventstampcard.firebasestorage.app",
          messagingSenderId: "1072393228911",
          appId: "1:1072393228911:web:66f14d85a50749e7b9b39a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. ฟังก์ชันสร้าง 500 รหัสขึ้น Firebase
        async function generateAndUploadCodes() {
            let updates = {};
            for(let i=0; i<500; i++) {
                let code = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                updates[code] = { stations: Array(7).fill(false), isRedeemed: false };
            }
            await db.ref('users').set(updates);
            alert("อัปโหลด 500 รหัสเรียบร้อย");
        }

        // 2. ฟังข้อมูล Real-time จาก Firebase
        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if(!data) return;

            Object.keys(data).forEach((code, index) => {
                const user = data[code];
                const passed = user.stations ? user.stations.filter(s => s === true).length : 0;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${code}</td>
                    <td>${passed} / 7</td>
                    <td>${passed === 7 ? '<span class="badge completed">ผ่านครบ</span>' : 'กำลังเล่น'}</td>
                    <td>${user.isRedeemed ? 'รับแล้ว' : 'ยังไม่รับ'}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
