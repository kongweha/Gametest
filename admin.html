<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน (Admin Dashboard)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #334155; }
        .admin-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
        h1 { margin-top: 0; color: #1e293b; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; color: white; margin-left: 10px; }
        .btn-danger:hover { background-color: #dc2626; }
        .stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .card { background: #f8fafc; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #64748b; }
        .card .value { font-size: 28px; font-weight: bold; color: #0f172a; }
        
        /* ช่องค้นหา */
        .search-box { width: 100%; padding: 15px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 20px; box-sizing: border-box; transition: 0.2s; }
        .search-box:focus { border-color: #3b82f6; outline: none; }

        table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        th { background-color: #f8fafc; color: #475569; }
        
        .badge { padding: 6px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; display: inline-block; transition: 0.2s; }
        .badge:hover { transform: scale(1.05); }
        .badge.none { background: #e2e8f0; color: #64748b; }
        .badge.playing { background: #fef08a; color: #854d0e; }
        .badge.completed { background: #bbf7d0; color: #166534; }
        .badge.redeemed { background: #bfdbfe; color: #1e40af; }
        .clickable-status { text-decoration: underline; text-underline-offset: 4px; }

        /* Modal สำหรับดูประวัติ */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #64748b; background: none; border: none; }
        .timeline { list-style: none; padding: 0; margin: 20px 0 0 0; }
        .timeline li { padding-bottom: 15px; border-left: 2px solid #e2e8f0; margin-left: 10px; padding-left: 20px; position: relative; }
        .timeline li:last-child { border-left: none; }
        .timeline li::before { content: ''; position: absolute; left: -6px; top: 0; width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; }
        .timeline-time { font-size: 12px; color: #94a3b8; margin-left: 10px; }
        .duration-box { font-size: 12px; color: #d97706; background: #fef3c7; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="action-bar">
            <h1>⚙️ ระบบจัดการหลังบ้าน (Admin)</h1>
            <div>
                <button class="btn-primary" onclick="generateAndUploadCodes()">🔄 สร้างและอัปโหลด 500 รหัส</button>
                <button class="btn-danger" onclick="clearDatabase()">🗑️ ล้างฐานข้อมูล</button>
            </div>
        </div>

        <div class="stats-cards">
            <div class="card"><h3>รหัสทั้งหมด</h3><div class="value" id="statTotal">0</div></div>
            <div class="card"><h3>ผ่านครบ 7 ฐานแล้ว</h3><div class="value" id="statCompleted" style="color: #10b981;">0</div></div>
            <div class="card"><h3>แลกรางวัลแล้ว</h3><div class="value" id="statRedeemed" style="color: #3b82f6;">0</div></div>
        </div>

        <!-- ช่องค้นหา -->
        <input type="text" id="searchInput" class="search-box" onkeyup="filterTable()" placeholder="🔍 ค้นหารหัสสมาชิก 6 หลัก...">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">ลำดับ</th>
                        <th style="width: 25%;">รหัสสมาชิก</th>
                        <th style="width: 25%;">ฐานที่ผ่าน</th>
                        <th style="width: 20%;">สถานะ (กดเพื่อดูประวัติ)</th>
                        <th style="width: 20%;">การแลกรางวัล</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5">⏳ กำลังเชื่อมต่อฐานข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal ประวัติเวลา -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 style="margin-top: 0; margin-bottom: 5px;">📜 ประวัติการเล่น</h2>
            <div id="modalUserCode" style="color: #64748b; font-weight: bold; margin-bottom: 20px;">รหัส: -</div>
            <ul class="timeline" id="timelineContent">
                <!-- ข้อมูลประวัติจะถูกสร้างที่นี่ -->
            </ul>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAJlt9qKkkUqPrQL7RLoRAPO-ToYwY7Q2o",
          authDomain: "eventstampcard.firebaseapp.com",
          databaseURL: "https://eventstampcard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "eventstampcard",
          storageBucket: "eventstampcard.firebasestorage.app",
          messagingSenderId: "1072393228911",
          appId: "1:1072393228911:web:66f14d85a50749e7b9b39a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let globalUsersData = {}; // เก็บข้อมูลไว้ดึงตอนกดดูประวัติ

        async function generateAndUploadCodes() {
            if(confirm("การสร้างใหม่จะลบข้อมูลเดิมทั้งหมด ยืนยันหรือไม่?")) {
                let codesSet = new Set();
                while(codesSet.size < 500) {
                    codesSet.add(Math.floor(100000 + Math.random() * 900000).toString());
                }

                let updates = {};
                codesSet.forEach(code => {
                    updates[code] = { stations: Array(7).fill(false), isRedeemed: false };
                });

                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">⏳ กำลังอัปโหลดข้อมูล 500 รหัส...</td></tr>';
                await db.ref('users').set(updates);
                alert("สร้างและอัปโหลด 500 รหัส (6 หลัก) สำเร็จ!");
            }
        }

        async function clearDatabase() {
            if(confirm("ลบข้อมูลทั้งหมดออกจากระบบ แน่ใจหรือไม่?")) {
                await db.ref('users').remove();
            }
        }

        // ฟังก์ชันค้นหาในตาราง
        function filterTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let codeCell = rows[i].getElementsByTagName("td")[1];
                if (codeCell) {
                    let text = codeCell.textContent || codeCell.innerText;
                    rows[i].style.display = text.toLowerCase().includes(input) ? "" : "none";
                }
            }
        }

        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('tableBody');
            
            if(!data) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: #94a3b8; padding: 20px;">ไม่มีข้อมูลในระบบ</td></tr>';
                document.getElementById('statTotal').innerText = 0;
                document.getElementById('statCompleted').innerText = 0;
                document.getElementById('statRedeemed').innerText = 0;
                return;
            }

            globalUsersData = data; 
            tbody.innerHTML = '';
            let total = 0, completedCount = 0, redeemedCount = 0;

            Object.keys(data).forEach((code, index) => {
                total++;
                const user = data[code];
                const passedStations = user.stations ? user.stations.filter(s => s === true).length : 0;
                
                if(passedStations === 7) completedCount++;
                if(user.isRedeemed) redeemedCount++;

                let statusClass = passedStations === 0 ? 'none' : (passedStations < 7 ? 'playing' : 'completed');
                let statusText = passedStations === 0 ? 'ยังไม่เริ่มเล่น' : (passedStations < 7 ? 'กำลังเล่น' : 'ผ่านครบแล้ว');
                
                // สถานะแบบกดได้
                let statusBadge = `<span class="badge ${statusClass} clickable-status" onclick="openModal('${code}')">${statusText} 🔍</span>`;
                
                let redeemedBadge = user.isRedeemed ? '<span class="badge redeemed">รับแล้ว 🎁</span>' : '<span class="badge none">ยังไม่รับ</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="font-family: monospace; font-size: 18px; font-weight: bold; letter-spacing: 2px;">${code}</td>
                    <td><b>${passedStations}</b> / 7</td>
                    <td>${statusBadge}</td>
                    <td>${redeemedBadge}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCompleted').innerText = completedCount;
            document.getElementById('statRedeemed').innerText = redeemedCount;
        });

        // ฟังก์ชันคำนวณระยะเวลา
        function formatTime(ms) {
            if(!ms) return '-';
            return new Date(ms).toLocaleTimeString('th-TH');
        }
        function getDuration(startMs, endMs) {
            if(!startMs || !endMs) return '';
            let diff = Math.floor((endMs - startMs) / 1000);
            let m = Math.floor(diff / 60);
            let s = diff % 60;
            if(m === 0) return `ใช้เวลา ${s} วินาที`;
            return `ใช้เวลา ${m} นาที ${s} วินาที`;
        }

        // จัดการ Modal
        function openModal(code) {
            document.getElementById('historyModal').style.display = 'flex';
            document.getElementById('modalUserCode').innerText = `รหัสสมาชิก: ${code}`;
            
            const user = globalUsersData[code];
            const timeline = document.getElementById('timelineContent');
            timeline.innerHTML = '';

            if(!user || (!user.loginTime && !user.scanHistory)) {
                timeline.innerHTML = '<li>ไม่มีประวัติการเล่น (ระบบเก็บเวลาเพิ่งอัปเดต)</li>';
                return;
            }

            let lastTime = user.loginTime;
            
            // 1. เวลาล็อกอิน
            if(user.loginTime) {
                timeline.innerHTML += `<li><b>🔐 เข้าสู่ระบบ</b> <span class="timeline-time">${formatTime(user.loginTime)}</span></li>`;
            }

            // 2. เวลาแต่ละฐาน
            if(user.scanHistory) {
                // แปลง object เป็น array และเรียงตามเวลา
                const scans = Object.values(user.scanHistory).sort((a, b) => a.time - b.time);
                
                scans.forEach((scan, index) => {
                    let durationHtml = '';
                    if(lastTime) {
                        durationHtml = `<br><span class="duration-box">⏱️ ${getDuration(lastTime, scan.time)}</span>`;
                    }
                    timeline.innerHTML += `<li><b>📍 ฐาน: ${scan.name}</b> <span class="timeline-time">${formatTime(scan.time)}</span> ${durationHtml}</li>`;
                    lastTime = scan.time;
                });
            }

            // 3. เวลารับรางวัล
            if(user.isRedeemed && user.redeemTime) {
                let durationHtml = '';
                if(lastTime) {
                    durationHtml = `<br><span class="duration-box">⏱️ ${getDuration(lastTime, user.redeemTime)}</span>`;
                }
                timeline.innerHTML += `<li><b>🎁 แลกรับรางวัล</b> <span class="timeline-time">${formatTime(user.redeemTime)}</span> ${durationHtml}</li>`;
            }
        }

        function closeModal() {
            document.getElementById('historyModal').style.display = 'none';
        }
    </script>
</body>
</html>
