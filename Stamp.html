<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสะสมแต้ม Event</title>
    <!-- โหลด Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; position: relative; box-sizing: border-box; }
        
        /* สไตล์สำหรับกล่องกรอกรหัส 6 ช่อง */
        .otp-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .otp-box { width: 45px; height: 55px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 24px; text-align: center; font-weight: bold; color: #334155; }
        .otp-box:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 5px rgba(59,130,246,0.3); }

        /* สไตล์สำหรับแผนที่วงกลม */
        .map-container { position: relative; width: 320px; height: 320px; margin: 20px auto; }
        .station-node { position: absolute; width: 85px; height: 85px; border-radius: 50%; border: 2px dashed #94a3b8; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: bold; color: #64748b; cursor: pointer; transition: 0.2s; overflow: hidden; padding: 4px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .station-node:hover { transform: scale(1.05); border-color: #3b82f6; }
        .station-node.stamped { border: none; background: transparent; padding: 0; pointer-events: none; }
        .station-node img { width: 100%; height: 100%; object-fit: cover; }
        
        /* การจัดวางตำแหน่งวงกลม (อิงตามภาพ 2.png) */
        .st-0 { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 110px; height: 110px; z-index: 2; font-size: 12px;} /* ตรงกลาง */
        .st-4 { top: 0; left: 50%; transform: translate(-50%, 0); } /* บน */
        .st-1 { top: 15%; right: -10px; } /* บนขวา */
        .st-6 { bottom: 15%; right: -10px; } /* ล่างขวา */
        .st-5 { bottom: 0; left: 50%; transform: translate(-50%, 0); } /* ล่าง */
        .st-2 { bottom: 15%; left: -10px; } /* ล่างซ้าย */
        .st-3 { top: 15%; left: -10px; } /* บนซ้าย */

        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; box-sizing: border-box;}
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-redeem { background-color: #ef4444; color: white; margin-top: 15px;}
        .btn-redeem:disabled { background-color: #fca5a5; cursor: not-allowed; }
        .btn-cancel { background-color: #64748b; color: white; display: none; }
        .btn-logout { background-color: #94a3b8; color: white; margin-top: 10px; font-size: 14px; padding: 8px;}
        
        #reader { width: 100%; margin-bottom: 15px; display: none; border-radius: 10px; overflow: hidden; }
        .hidden { display: none !important; }
        .user-info { background-color: #e2e8f0; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #475569; display: inline-block; margin-bottom: 10px; }
        .success-banner { background-color: #fef3c7; border: 2px solid #f59e0b; color: #d97706; padding: 20px; border-radius: 15px; margin: 20px 0; font-size: 18px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <h2>🔐 เข้าสู่ระบบสะสมแต้ม</h2>
        
        <!-- เปลี่ยน Input เป็น 6 ช่องแยกกัน -->
        <div class="otp-container" id="otpGroup">
            <input type="tel" class="otp-box" maxlength="1" oninput="handleOtp(this, event)">
            <input type="tel" class="otp-box" maxlength="1" oninput="handleOtp(this, event)">
            <input type="tel" class="otp-box" maxlength="1" oninput="handleOtp(this, event)">
            <input type="tel" class="otp-box" maxlength="1" oninput="handleOtp(this, event)">
            <input type="tel" class="otp-box" maxlength="1" oninput="handleOtp(this, event)">
            <input type="tel" class="otp-box" maxlength="1" oninput="handleOtp(this, event)">
        </div>

        <button id="btnLogin" class="btn-primary" onclick="login()">ตกลงเพื่อเข้าสู่ระบบ</button>
    </div>

    <div class="container hidden" id="stampScreen">
        <h2>🎉 บัตรสะสมแต้ม</h2>
        <div class="user-info" id="displayUserCode">รหัสสมาชิก: XXXXXX</div>
        
        <div id="successBanner" class="success-banner hidden">
            🎁 รับของรางวัลเรียบร้อยแล้ว!<br><span style="font-size: 14px; color:#92400e;">(ไม่สามารถเล่นซ้ำได้)</span>
        </div>

        <div id="stampArea">
            <div id="statusText" style="font-weight: bold; margin-bottom: 5px; color: #10b981;">แต้มปัจจุบัน: 0 / 7</div>
            <div style="font-size: 12px; color: #64748b; margin-bottom: 15px;">(คลิกที่วงกลมแต่ละฐานเพื่อสแกน QR Code)</div>
            
            <!-- เลย์เอาต์วงกลมตามรูปแบบภาพ 2.png -->
            <div class="map-container" id="mapContainer"></div>
            
            <div id="reader"></div>
            <button id="btnCancel" class="btn-cancel" onclick="stopScan()">❌ ยกเลิกสแกนกล้อง</button>
            <button id="btnRedeem" class="btn-redeem" onclick="redeemReward()" disabled>🎁 แลกของรางวัล (ต้องครบ 7 ฐาน)</button>
        </div>
        
        <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAJlt9qKkkUqPrQL7RLoRAPO-ToYwY7Q2o",
          authDomain: "eventstampcard.firebaseapp.com",
          databaseURL: "https://eventstampcard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "eventstampcard",
          storageBucket: "eventstampcard.firebasestorage.app",
          messagingSenderId: "1072393228911",
          appId: "1:1072393228911:web:66f14d85a50749e7b9b39a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // ข้อมูลของภาพ 2 แบบ นำ URL ภาพหรือตำแหน่งโฟลเดอร์ในโปรเจกต์มาใส่แทนที่ได้เลย
        const STATIONS = [
            { id: 0, name: "Library Playground", qr: "QR_STN_01", imgUnstamped: "url_to_image/2_center.png", imgStamped: "url_to_image/1_center.png" },
            { id: 1, name: "Discovery Lab", qr: "QR_STN_02", imgUnstamped: "url_to_image/2_top_right.png", imgStamped: "url_to_image/1_top_right.png" },
            { id: 2, name: "Play Zone", qr: "QR_STN_03", imgUnstamped: "url_to_image/2_bottom_left.png", imgStamped: "url_to_image/1_bottom_left.png" },
            { id: 3, name: "Treasure Corner", qr: "QR_STN_04", imgUnstamped: "url_to_image/2_top_left.png", imgStamped: "url_to_image/1_top_left.png" },
            { id: 4, name: "Media Studio", qr: "QR_STN_05", imgUnstamped: "url_to_image/2_top.png", imgStamped: "url_to_image/1_top.png" },
            { id: 5, name: "Tech Station", qr: "QR_STN_06", imgUnstamped: "url_to_image/2_bottom.png", imgStamped: "url_to_image/1_bottom.png" },
            { id: 6, name: "Safety Checkpoint", qr: "QR_STN_07", imgUnstamped: "url_to_image/2_bottom_right.png", imgStamped: "url_to_image/1_bottom_right.png" }
        ];

        let currentUserCode = "";
        let html5QrCode;
        let dbRef = null;
        let activeTargetStation = null; // เก็บค่าว่าตอนนี้กำลังจะสแกนของฐานไหน

        // จัดการเรื่องการพิมพ์ในช่องรหัส 6 ช่อง
        function handleOtp(field, event) {
            field.value = field.value.replace(/[^0-9]/g, '');
            if (field.value.length === 1 && field.nextElementSibling) {
                field.nextElementSibling.focus();
            }
        }
        document.querySelectorAll('.otp-box').forEach((box, index, list) => {
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '') {
                    if (list[index - 1]) list[index - 1].focus();
                }
            });
        });

        async function login() {
            // รวมค่าจาก input 6 ช่อง
            let input = Array.from(document.querySelectorAll('.otp-box')).map(box => box.value).join('');
            if (input.length !== 6) { alert("กรุณากรอกรหัสให้ครบ 6 หลัก"); return; }
            
            document.getElementById('btnLogin').disabled = true;
            document.getElementById('btnLogin').innerText = "กำลังตรวจสอบ...";

            const snapshot = await db.ref(`users/${input}`).once('value');
            if (snapshot.exists()) {
                currentUserCode = input;
                document.getElementById('displayUserCode').innerText = `รหัสสมาชิก: ${currentUserCode}`;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('stampScreen').classList.remove('hidden');
                
                dbRef = db.ref(`users/${currentUserCode}`);
                dbRef.on('value', (snap) => {
                    renderUI(snap.val());
                });
            } else {
                alert("❌ ไม่พบรหัสนี้ในระบบ");
                document.getElementById('btnLogin').disabled = false;
                document.getElementById('btnLogin').innerText = "ตกลงเพื่อเข้าสู่ระบบ";
            }
        }

        function renderUI(userData) {
            if (userData.isRedeemed) {
                document.getElementById('stampArea').classList.add('hidden');
                document.getElementById('successBanner').classList.remove('hidden');
                return;
            }

            const mapContainer = document.getElementById('mapContainer');
            mapContainer.innerHTML = ''; 
            let count = 0;

            const userStations = userData.stations || Array(7).fill(false);

            STATIONS.forEach((st, index) => {
                const node = document.createElement('div');
                const isPassed = userStations[index];
                
                // ใส่คลาสสำหรับระบุตำแหน่ง (st-0 ถึง st-6)
                node.className = `station-node st-${index} ${isPassed ? 'stamped' : ''}`;
                
                if (isPassed) {
                    count++;
                    // ถ้าผ่านแล้ว จะดึงรูปภาพแบบภาพที่ 1.png มาแสดง
                    node.innerHTML = `<img src="${st.imgStamped}" alt="ผ่านแล้ว">`;
                } else {
                    // ถ้ายังไม่ผ่าน จะแสดงรูป/โครงร่างของภาพที่ 2.png หรือ ชื่อฐาน 
                    // ถ้าอัปโหลดรูป 2.png แล้ว สามารถเปิดใช้งานบรรทัดล่างแทนได้เลย
                    // node.innerHTML = `<img src="${st.imgUnstamped}">`;
                    node.innerHTML = `<span>${st.name}</span>`;
                    node.onclick = () => openScannerFor(index);
                }
                mapContainer.appendChild(node);
            });

            document.getElementById('statusText').innerText = count === 7 ? "🎉 เล่นครบ 7 ฐานแล้ว!" : `แต้มปัจจุบัน: ${count} / 7 ฐาน`;
            document.getElementById('btnRedeem').disabled = (count < 7);
        }

        function openScannerFor(stationIndex) {
            activeTargetStation = STATIONS[stationIndex];
            
            // ซ่อนวงกลมทั้งหมดก่อนเพื่อเปิดพื้นที่ให้กล้อง
            document.getElementById('mapContainer').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btnCancel').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 },
                async (decodedText) => {
                    if (decodedText.includes(activeTargetStation.qr)) {
                        stopScan();
                        await db.ref(`users/${currentUserCode}/stations/${activeTargetStation.id}`).set(true);
                    } else {
                        alert(`❌ QR Code ไม่ถูกต้องสำหรับฐาน ${activeTargetStation.name}`);
                        stopScan(); 
                    }
                }, (err) => {}
            ).catch(err => { alert("เปิดกล้องไม่ได้ กรุณาอนุญาตการเข้าถึงกล้อง"); stopScan(); });
        }

        function stopScan() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnCancel').style.display = 'none';
                    document.getElementById('mapContainer').style.display = 'block'; // แสดงวงกลมกลับมา
                    activeTargetStation = null;
                }).catch(e => {});
            }
        }

        async function redeemReward() {
            if (confirm("ต้องการกดแลกของรางวัลใช่หรือไม่? (ไม่สามารถย้อนกลับได้)")) {
                await db.ref(`users/${currentUserCode}/isRedeemed`).set(true);
            }
        }

        function logout() {
            try {
                stopScan();
                if(dbRef) {
                    dbRef.off();
                    dbRef = null;
                }
                currentUserCode = "";
                // ล้างค่าในช่องกรอก 6 ช่อง
                document.querySelectorAll('.otp-box').forEach(box => box.value = '');
                document.getElementById('btnLogin').disabled = false;
                document.getElementById('btnLogin').innerText = "ตกลงเพื่อเข้าสู่ระบบ";
                
                document.getElementById('stampScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('successBanner').classList.add('hidden');
                document.getElementById('stampArea').classList.remove('hidden');
            } catch (error) {
                console.error("Logout Error:", error);
                location.reload(); 
            }
        }
    </script>
</body>
</html>
