<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน (Admin Dashboard)</title>
    <!-- โหลด Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #334155; }
        .admin-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
        h1 { margin-top: 0; color: #1e293b; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; color: white; margin-left: 10px; }
        .btn-danger:hover { background-color: #dc2626; }
        .stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .card { background: #f8fafc; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #64748b; }
        .card .value { font-size: 28px; font-weight: bold; color: #0f172a; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        th { background-color: #f8fafc; color: #475569; position: sticky; top: 0; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge.none { background: #e2e8f0; color: #64748b; }
        .badge.playing { background: #fef08a; color: #854d0e; }
        .badge.completed { background: #bbf7d0; color: #166534; }
        .badge.redeemed { background: #bfdbfe; color: #1e40af; }
        .table-container { max-height: 500px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="action-bar">
            <h1>⚙️ ระบบจัดการหลังบ้าน (Admin)</h1>
            <div>
                <button class="btn-primary" onclick="generateAndUploadCodes()">🔄 สร้างและอัปโหลด 500 รหัส (6 หลัก)</button>
                <button class="btn-danger" onclick="clearDatabase()">🗑️ ล้างฐานข้อมูล</button>
            </div>
        </div>

        <div class="stats-cards">
            <div class="card"><h3>รหัสทั้งหมด</h3><div class="value" id="statTotal">0</div></div>
            <div class="card"><h3>ผ่านครบ 7 ฐานแล้ว</h3><div class="value" id="statCompleted" style="color: #10b981;">0</div></div>
            <div class="card"><h3>แลกรางวัลแล้ว</h3><div class="value" id="statRedeemed" style="color: #3b82f6;">0</div></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">ลำดับ</th>
                        <th style="width: 25%;">รหัสสมาชิก</th>
                        <th style="width: 25%;">ฐานที่ผ่าน</th>
                        <th style="width: 20%;">สถานะ</th>
                        <th style="width: 20%;">การแลกรางวัล</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5">⏳ กำลังเชื่อมต่อฐานข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAJlt9qKkkUqPrQL7RLoRAPO-ToYwY7Q2o",
          authDomain: "eventstampcard.firebaseapp.com",
          databaseURL: "https://eventstampcard-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "eventstampcard",
          storageBucket: "eventstampcard.firebasestorage.app",
          messagingSenderId: "1072393228911",
          appId: "1:1072393228911:web:66f14d85a50749e7b9b39a"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function generateAndUploadCodes() {
            if(confirm("การสร้างใหม่จะลบข้อมูลเดิมทั้งหมด ยืนยันหรือไม่?")) {
                let codesSet = new Set();
                while(codesSet.size < 500) {
                    // เปลี่ยนการสุ่มตัวเลขจาก 10 หลัก เป็น 6 หลัก
                    codesSet.add(Math.floor(100000 + Math.random() * 900000).toString());
                }

                let updates = {};
                codesSet.forEach(code => {
                    updates[code] = {
                        stations: Array(7).fill(false),
                        isRedeemed: false
                    };
                });

                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">⏳ กำลังอัปโหลดข้อมูล 500 รหัส...</td></tr>';
                await db.ref('users').set(updates);
                alert("สร้างและอัปโหลด 500 รหัส (6 หลัก) สำเร็จ!");
            }
        }

        async function clearDatabase() {
            if(confirm("ลบข้อมูลทั้งหมดออกจากระบบ แน่ใจหรือไม่?")) {
                await db.ref('users').remove();
            }
        }

        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('tableBody');
            
            if(!data) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: #94a3b8; padding: 20px;">ไม่มีข้อมูลในระบบ</td></tr>';
                document.getElementById('statTotal').innerText = 0;
                document.getElementById('statCompleted').innerText = 0;
                document.getElementById('statRedeemed').innerText = 0;
                return;
            }

            tbody.innerHTML = '';
            let total = 0, completedCount = 0, redeemedCount = 0;

            Object.keys(data).forEach((code, index) => {
                total++;
                const user = data[code];
                const passedStations = user.stations ? user.stations.filter(s => s === true).length : 0;
                
                if(passedStations === 7) completedCount++;
                if(user.isRedeemed) redeemedCount++;

                let statusBadge = passedStations === 0 ? '<span class="badge none">ยังไม่เริ่มเล่น</span>' : 
                                  passedStations < 7 ? '<span class="badge playing">กำลังเล่น</span>' : 
                                  '<span class="badge completed">ผ่านครบแล้ว</span>';
                let redeemedBadge = user.isRedeemed ? '<span class="badge redeemed">รับแล้ว 🎁</span>' : '<span class="badge none">ยังไม่รับ</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${index + 1}</td><td style="font-family: monospace; font-size: 16px; font-weight: bold; letter-spacing: 1px;">${code}</td><td><b>${passedStations}</b> / 7</td><td>${statusBadge}</td><td>${redeemedBadge}</td>`;
                tbody.appendChild(tr);
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCompleted').innerText = completedCount;
            document.getElementById('statRedeemed').innerText = redeemedCount;
        });
    </script>
</body>
</html>
