<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสะสมแต้ม Event</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; position: relative;}
        .input-group input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 18px; box-sizing: border-box; text-align: center; letter-spacing: 2px; margin-bottom: 15px;}
        
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 25px 0; }
        .stamp-slot { aspect-ratio: 1 / 1; border-radius: 15px; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #94a3b8; transition: all 0.2s; background: #f8fafc;}
        
        /* สไตล์เวลาเก็บฐานสำเร็จ */
        .stamp-slot.active { background-color: #ecfdf5; border-color: #10b981; color: #047857; transform: scale(1.05); box-shadow: 0 4px 6px rgba(16,185,129,0.15); font-weight: bold;}
        
        /* ปรับ CSS สำหรับรูปภาพแทน Emoji */
        .stamp-icon { width: 35px; height: 35px; margin-bottom: 5px; object-fit: contain; border-radius: 5px; }
        
        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-redeem { background-color: #ef4444; color: white; margin-top: 15px;}
        .btn-redeem:disabled { background-color: #fca5a5; cursor: not-allowed; }
        .btn-lucky { background-color: #8b5cf6; color: white; margin-top: 15px; animation: pulse 2s infinite;}
        .btn-cancel { background-color: #64748b; color: white; display: none; }
        .btn-logout { background-color: #94a3b8; color: white; margin-top: 10px; font-size: 14px; padding: 8px;}
        
        #reader { width: 100%; margin-bottom: 15px; display: none; border-radius: 10px; overflow: hidden; }
        .hidden { display: none !important; }
        .user-info { background-color: #e2e8f0; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #475569; display: inline-block; margin-bottom: 10px; }
        .loading { font-style: italic; color: #3b82f6; display: none; margin-top: 10px; font-weight: bold; font-size: 14px;}
        
        /* สัญลักษณ์บอกว่ากำลังเชื่อมต่อ Real-time */
        .sync-indicator { position: absolute; top: 15px; right: 15px; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: blink 1.5s infinite; display: none; }
        
        .success-banner { background-color: #fef3c7; border: 2px solid #f59e0b; color: #d97706; padding: 20px; border-radius: 15px; margin: 20px 0; font-size: 18px; font-weight: bold;}
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <h2>🔐 เข้าสู่ระบบสะสมแต้ม</h2>
        <div class="input-group">
            <input type="tel" id="userCode" maxlength="10" placeholder="กรอกรหัส 10 หลัก" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <button id="btnLogin" class="btn-primary" onclick="login()">ตกลงเพื่อเข้าสู่ระบบ</button>
        <div id="loadingLogin" class="loading">⏳ กำลังดึงข้อมูล...</div>
    </div>

    <div class="container hidden" id="stampScreen">
        <div id="syncDot" class="sync-indicator" title="อัปเดตข้อมูลแบบ Real-time"></div>
        <h2>🎉 บัตรสะสมแต้ม</h2>
        <div class="user-info" id="displayUserCode">รหัสสมาชิก: XXXXXXXXXX</div>
        
        <div id="successBanner" class="success-banner hidden">
            🎁 รับของรางวัลเรียบร้อยแล้ว!<br><span style="font-size: 14px; color:#92400e;">(ไม่สามารถเล่นซ้ำได้)</span>
        </div>

        <div id="stampArea">
            <!-- ตารางแสตมป์ -->
            <div class="stamp-grid" id="stampGrid"></div>
            <div id="statusText" style="font-weight: bold; margin-bottom: 15px;">แต้มปัจจุบัน: 0 / 10</div>
            
            <div id="reader"></div>
            <button id="btnScan" class="btn-primary" onclick="startScan()">📷 สแกน QR Code ฐาน</button>
            <button id="btnCancel" class="btn-cancel" onclick="stopScan()">❌ ยกเลิก</button>
            <div id="loadingAction" class="loading">⏳ กำลังบันทึกข้อมูลหลังบ้าน...</div>
            
            <button id="btnRedeem" class="btn-redeem" onclick="redeemReward()" disabled>🎁 แลกของรางวัล (ต้องครบ 10 ฐาน)</button>
        </div>
        
        <button id="btnLucky" class="btn-lucky hidden" onclick="alert('ฟีเจอร์สแกนลุ้นโชคกำลังมาเร็วๆ นี้!')">🔮 สแกนเพื่อลุ้นของรางวัล</button>
        
        <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxpt48SWOSpXcKlliR_ihZiE09OX_3Ifw03Cs48UC8Am3qBfDPa8O3ADMSbgOuiUPodag/exec";
        
        // 🎯 ตั้งค่าชื่อฐานและรูปภาพ (เปลี่ยน URL รูปใน imgInactive และ imgActive ให้เป็นรูปของคุณ)
        // เพื่อให้ง่ายต่อการทดสอบ ผมใส่รูป Placeholder ให้เห็นภาพก่อน
        const STATIONS = [
            { id: 0, name: "ฐาน 1", qr: "QR_STN_01", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 1, name: "ฐาน 2", qr: "QR_STN_02", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 2, name: "ฐาน 3", qr: "QR_STN_03", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 3, name: "ฐาน 4", qr: "QR_STN_04", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 4, name: "ฐาน 5", qr: "QR_STN_05", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 5, name: "AIX",    qr: "QR_STN_06", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 6, name: "ฐาน 7", qr: "QR_STN_07", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 7, name: "ฐาน 8", qr: "QR_STN_08", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 8, name: "ฐาน 9", qr: "QR_STN_09", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 9, name: "ฐาน 10", qr: "QR_STN_10", imgInactive: "https://placehold.co/100x100/e2e8f0/94a3b8?text=?", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" }
        ];

        let currentUser = { code: "", stations: Array(10).fill(false), isRedeemed: false };
        let html5QrCode;
        let syncInterval = null; 

        function login() {
            const input = document.getElementById('userCode').value;
            if (input.length !== 10) { alert("กรุณากรอกรหัสให้ครบ 10 หลัก"); return; }
            
            document.getElementById('loadingLogin').style.display = 'block';
            document.getElementById('btnLogin').disabled = true;

            fetch(`${API_URL}?action=checkLogin&userCode=${input}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loadingLogin').style.display = 'none';
                    document.getElementById('btnLogin').disabled = false;
                    
                    if (data.success) {
                        currentUser.code = input;
                        currentUser.stations = data.stations;
                        currentUser.isRedeemed = data.isRedeemed;
                        
                        document.getElementById('displayUserCode').innerText = `รหัสสมาชิก: ${currentUser.code}`;
                        document.getElementById('loginScreen').classList.add('hidden');
                        document.getElementById('stampScreen').classList.remove('hidden');
                        
                        renderUI();
                        startRealTimeSync(); 
                    } else {
                        alert(data.message);
                    }
                }).catch(err => { 
                    alert("เกิดข้อผิดพลาดเครือข่าย"); 
                    document.getElementById('loadingLogin').style.display = 'none';
                    document.getElementById('btnLogin').disabled = false;
                });
        }

        // 🔄 ฟังก์ชันสำหรับดึงข้อมูลแบบ Real-time
        function startRealTimeSync() {
            document.getElementById('syncDot').style.display = 'block';
            
            syncInterval = setInterval(() => {
                if (!currentUser.code) return;

                fetch(`${API_URL}?action=checkLogin&userCode=${currentUser.code}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            const isChanged = 
                                JSON.stringify(currentUser.stations) !== JSON.stringify(data.stations) || 
                                currentUser.isRedeemed !== data.isRedeemed;

                            if (isChanged) {
                                currentUser.stations = data.stations;
                                currentUser.isRedeemed = data.isRedeemed;
                                renderUI();
                            }
                        }
                    }).catch(err => console.log("Real-time sync failed temporarily"));
            }, 4000); 
        }

        function stopRealTimeSync() {
            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }
            document.getElementById('syncDot').style.display = 'none';
        }

        // ฟังก์ชันอัปเดตหน้าจอทั้งหมด (UI) โดยแทรกรูปภาพตามสถานะ
        function renderUI() {
            if (currentUser.isRedeemed) {
                document.getElementById('stampArea').classList.add('hidden');
                document.getElementById('successBanner').classList.remove('hidden');
                document.getElementById('btnLucky').classList.remove('hidden');
                stopRealTimeSync(); 
                return;
            }

            const grid = document.getElementById('stampGrid');
            grid.innerHTML = ''; 
            let count = 0;

            STATIONS.forEach((st, index) => {
                const slot = document.createElement('div');
                const isPassed = currentUser.stations[index];
                
                if (isPassed) {
                    count++;
                    slot.className = 'stamp-slot active';
                    // ใช้ imgActive
                    slot.innerHTML = `<img src="${st.imgActive}" class="stamp-icon" alt="ผ่านแล้ว"><div style="font-size: 11px;">${st.name}</div>`;
                } else {
                    slot.className = 'stamp-slot';
                    // ใช้ imgInactive
                    slot.innerHTML = `<img src="${st.imgInactive}" class="stamp-icon" alt="ยังไม่ผ่าน"><div style="font-size: 11px;">${st.name}</div>`;
                }
                grid.appendChild(slot);
            });

            document.getElementById('statusText').innerText = count === 10 ? "🎉 เล่นครบ 10 ฐานแล้ว!" : `ผ่านแล้ว: ${count} / 10 ฐาน`;
            
            document.getElementById('btnRedeem').disabled = (count < 10);
            document.getElementById('btnScan').style.display = (count === 10) ? 'none' : 'block';
        }

        function startScan() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btnScan').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 },
                (decodedText) => {
                    const matchedStation = STATIONS.find(s => decodedText.includes(s.qr));
                    
                    if (!matchedStation) {
                        alert("❌ QR Code ไม่ถูกต้อง ไม่ใช่ของกิจกรรมนี้");
                        stopScan(); return;
                    }

                    if (currentUser.stations[matchedStation.id]) {
                        alert(`⚠️ คุณผ่าน ${matchedStation.name} ไปแล้วครับ!`);
                        stopScan(); return;
                    }

                    stopScan();
                    processStamp(matchedStation);
                }, (err) => {}
            ).catch(err => { alert("เปิดกล้องไม่ได้"); stopScan(); });
        }

        function stopScan() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnScan').style.display = 'block';
                    document.getElementById('btnCancel').style.display = 'none';
                }).catch(e => {});
            }
        }

        function processStamp(station) {
            currentUser.stations[station.id] = true;
            renderUI(); 
            document.getElementById('loadingAction').style.display = 'block';

            fetch(`${API_URL}?action=addStamp&userCode=${currentUser.code}&stationIndex=${station.id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loadingAction').style.display = 'none';
                    if (!data.success) {
                        alert("เกิดข้อผิดพลาดในการบันทึกหลังบ้าน");
                        currentUser.stations[station.id] = false; 
                        renderUI();
                    }
                });
        }

        function redeemReward() {
            if (confirm("ต้องการกดแลกของรางวัลใช่หรือไม่? (ไม่สามารถย้อนกลับได้)")) {
                document.getElementById('btnRedeem').innerText = "กำลังดำเนินการ...";
                document.getElementById('btnRedeem').disabled = true;

                fetch(`${API_URL}?action=redeemReward&userCode=${currentUser.code}`)
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            currentUser.isRedeemed = true;
                            renderUI(); 
                        }
                    });
            }
        }

        function logout() {
            stopScan();
            stopRealTimeSync(); 
            currentUser = { code: "", stations: Array(10).fill(false), isRedeemed: false };
            document.getElementById('userCode').value = "";
            document.getElementById('stampScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
