<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสะสมแต้ม Event</title>
    <!-- โหลด Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; position: relative; box-sizing: border-box; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 18px; box-sizing: border-box; text-align: center; letter-spacing: 2px; margin-bottom: 15px;}
        .stamp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 20px 0; width: 100%; }
        .stamp-slot { aspect-ratio: 1 / 1; border-radius: 50%; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; transition: all 0.2s; background: #f8fafc; padding: 2px; box-sizing: border-box; text-align: center; overflow: hidden; }
        .stamp-slot div { font-size: clamp(9px, 2.5vw, 12px); line-height: 1.1; word-break: break-word; padding: 0 2px; }
        .stamp-slot.active { background-color: #ecfdf5; border-color: #10b981; color: #047857; transform: scale(1.05); box-shadow: 0 4px 6px rgba(16,185,129,0.15); font-weight: bold; padding: 2px; }
        .stamp-icon { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; box-sizing: border-box;}
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-redeem { background-color: #ef4444; color: white; margin-top: 15px;}
        .btn-redeem:disabled { background-color: #fca5a5; cursor: not-allowed; }
        .btn-cancel { background-color: #64748b; color: white; display: none; }
        .btn-logout { background-color: #94a3b8; color: white; margin-top: 10px; font-size: 14px; padding: 8px;}
        #reader { width: 100%; margin-bottom: 15px; display: none; border-radius: 10px; overflow: hidden; }
        .hidden { display: none !important; }
        .user-info { background-color: #e2e8f0; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #475569; display: inline-block; margin-bottom: 10px; }
        .success-banner { background-color: #fef3c7; border: 2px solid #f59e0b; color: #d97706; padding: 20px; border-radius: 15px; margin: 20px 0; font-size: 18px; font-weight: bold;}
        
        @media (max-width: 480px) { .container { padding: 20px 10px; } .stamp-grid { gap: 5px; } }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <h2>🔐 เข้าสู่ระบบสะสมแต้ม</h2>
        <div class="input-group">
            <input type="tel" id="userCode" maxlength="10" placeholder="กรอกรหัส 10 หลัก" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <button id="btnLogin" class="btn-primary" onclick="login()">ตกลงเพื่อเข้าสู่ระบบ</button>
    </div>

    <div class="container hidden" id="stampScreen">
        <h2>🎉 บัตรสะสมแต้ม</h2>
        <div class="user-info" id="displayUserCode">รหัสสมาชิก: XXXXXXXXXX</div>
        
        <div id="successBanner" class="success-banner hidden">
            🎁 รับของรางวัลเรียบร้อยแล้ว!<br><span style="font-size: 14px; color:#92400e;">(ไม่สามารถเล่นซ้ำได้)</span>
        </div>

        <div id="stampArea">
            <div class="stamp-grid" id="stampGrid"></div>
            <div id="statusText" style="font-weight: bold; margin-bottom: 15px;">แต้มปัจจุบัน: 0 / 7</div>
            
            <div id="reader"></div>
            <button id="btnScan" class="btn-primary" onclick="startScan()">📷 สแกน QR Code ฐาน</button>
            <button id="btnCancel" class="btn-cancel" onclick="stopScan()">❌ ยกเลิก</button>
            
            <button id="btnRedeem" class="btn-redeem" onclick="redeemReward()" disabled>🎁 แลกของรางวัล (ต้องครบ 7 ฐาน)</button>
        </div>
        
        <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <script>
        // 🔑 1. นำ Firebase Config เดียวกับหน้า Admin มาวางตรงนี้
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const STATIONS = [
            { id: 0, name: "Library Playground", qr: "QR_STN_01", imgActive: "https://lh3.googleusercontent.com/d/1IPeKd6HQZ_-DLhHz1fF4mncM4lw7babh" },
            { id: 1, name: "Discovery Lab", qr: "QR_STN_02", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 2, name: "Play Zone", qr: "QR_STN_03", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 3, name: "Treasure Corner", qr: "QR_STN_04", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 4, name: "Media Studio", qr: "QR_STN_05", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 5, name: "Tech Station", qr: "QR_STN_06", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" },
            { id: 6, name: "Safety Checkpoint", qr: "QR_STN_07", imgActive: "https://placehold.co/100x100/10b981/ffffff?text=OK" }
        ];

        let currentUserCode = "";
        let html5QrCode;
        let dbRef = null;

        async function login() {
            const input = document.getElementById('userCode').value;
            if (input.length !== 10) { alert("กรุณากรอกรหัสให้ครบ 10 หลัก"); return; }
            
            document.getElementById('btnLogin').disabled = true;
            document.getElementById('btnLogin').innerText = "กำลังตรวจสอบ...";

            // เช็คว่ามีรหัสนี้ในระบบไหม
            const snapshot = await db.ref(`users/${input}`).once('value');
            if (snapshot.exists()) {
                currentUserCode = input;
                document.getElementById('displayUserCode').innerText = `รหัสสมาชิก: ${currentUserCode}`;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('stampScreen').classList.remove('hidden');
                
                // ฟังการเปลี่ยนแปลงแบบ Real-time
                dbRef = db.ref(`users/${currentUserCode}`);
                dbRef.on('value', (snap) => {
                    renderUI(snap.val());
                });
            } else {
                alert("❌ ไม่พบรหัสนี้ในระบบ");
                document.getElementById('btnLogin').disabled = false;
                document.getElementById('btnLogin').innerText = "ตกลงเพื่อเข้าสู่ระบบ";
            }
        }

        function renderUI(userData) {
            if (userData.isRedeemed) {
                document.getElementById('stampArea').classList.add('hidden');
                document.getElementById('successBanner').classList.remove('hidden');
                return;
            }

            const grid = document.getElementById('stampGrid');
            grid.innerHTML = ''; 
            let count = 0;

            const userStations = userData.stations || Array(7).fill(false);

            STATIONS.forEach((st, index) => {
                const slot = document.createElement('div');
                const isPassed = userStations[index];
                
                if (isPassed) {
                    count++;
                    slot.className = 'stamp-slot active';
                    slot.innerHTML = `<img src="${st.imgActive}" class="stamp-icon" alt="ผ่านแล้ว">`;
                } else {
                    slot.className = 'stamp-slot';
                    slot.innerHTML = `<div style="font-weight: bold;">${st.name}</div>`;
                }
                grid.appendChild(slot);
            });

            document.getElementById('statusText').innerText = count === 7 ? "🎉 เล่นครบ 7 ฐานแล้ว!" : `ผ่านแล้ว: ${count} / 7 ฐาน`;
            document.getElementById('btnRedeem').disabled = (count < 7);
            document.getElementById('btnScan').style.display = (count === 7) ? 'none' : 'block';
        }

        function startScan() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btnScan').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 },
                async (decodedText) => {
                    const matchedStation = STATIONS.find(s => decodedText.includes(s.qr));
                    if (!matchedStation) {
                        alert(`❌ QR Code ไม่ถูกต้อง`);
                        stopScan(); return;
                    }
                    stopScan();
                    
                    // บันทึกผ่าน Firebase ทันที
                    await db.ref(`users/${currentUserCode}/stations/${matchedStation.id}`).set(true);
                }, (err) => {}
            ).catch(err => { alert("เปิดกล้องไม่ได้"); stopScan(); });
        }

        function stopScan() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnScan').style.display = 'block';
                    document.getElementById('btnCancel').style.display = 'none';
                }).catch(e => {});
            }
        }

        async function redeemReward() {
            if (confirm("ต้องการกดแลกของรางวัลใช่หรือไม่? (ไม่สามารถย้อนกลับได้)")) {
                await db.ref(`users/${currentUserCode}/isRedeemed`).set(true);
            }
        }

        function logout() {
            stopScan();
            if(dbRef) dbRef.off(); // ยกเลิกการฟัง Real-time ของคนเก่า
            currentUserCode = "";
            document.getElementById('userCode').value = "";
            document.getElementById('btnLogin').disabled = false;
            document.getElementById('btnLogin').innerText = "ตกลงเพื่อเข้าสู่ระบบ";
            document.getElementById('stampScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
