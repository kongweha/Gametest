<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App สะสมแต้ม</title>
    <style>
        /* ส่วนของการตกแต่งหน้าตา (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .reward-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .reward-card h2 {
            color: #333;
            margin-top: 0;
        }
        .reward-card p {
            color: #666;
            font-size: 14px;
        }
        /* ตารางสแตมป์ */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 25px 0;
        }
        .stamp-slot {
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 2px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #cbd5e1;
            transition: all 0.3s ease;
        }
        /* สแตมป์ที่ได้รับแล้ว */
        .stamp-slot.active {
            background-color: #10b981;
            border-color: #10b981;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
            transform: scale(1.1);
        }
        .status-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        /* ปุ่มกด */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-add {
            background-color: #3b82f6;
            color: white;
        }
        .btn-add:hover { background-color: #2563eb; }
        
        .btn-redeem {
            background-color: #ef4444;
            color: white;
        }
        .btn-redeem:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="reward-card">
        <h2>🎉 บัตรสะสมแต้ม</h2>
        <p>สะสมครบ 10 แต้ม เพื่อรับสิทธิพิเศษ!</p>
        
        <!-- พื้นที่แสดงสแตมป์ -->
        <div class="stamp-grid" id="stampGrid"></div>
        
        <div class="status-text" id="statusText">แต้มปัจจุบัน: 0 / 10</div>
        
        <!-- ในการใช้งานจริง ปุ่มนี้อาจซ่อนไว้ให้เฉพาะพนักงานกด หรือเปลี่ยนเป็นระบบสแกน QR -->
        <button class="btn-add" onclick="addStamp()">➕ จำลองการกดรับแต้ม</button>
        <button class="btn-redeem" onclick="redeemReward()">🎁 แลกของรางวัล (เริ่มใหม่)</button>
    </div>

    <script>
        // ส่วนของระบบการทำงาน (JavaScript)
        const MAX_STAMPS = 10;
        
        // ดึงข้อมูลแต้มเดิมจาก Local Storage ของเบราว์เซอร์ ถ้าไม่มีให้เริ่มที่ 0
        let currentStamps = parseInt(localStorage.getItem('myRewardStamps')) || 0;

        // ฟังก์ชันวาดหน้าตาสแตมป์
        function renderStamps() {
            const grid = document.getElementById('stampGrid');
            grid.innerHTML = ''; // ล้างค่าเดิมก่อน
            
            for (let i = 1; i <= MAX_STAMPS; i++) {
                const slot = document.createElement('div');
                // ถ้าจำนวนที่วนลูปอยู่น้อยกว่าหรือเท่ากับแต้มที่มี ให้ใส่คลาส active (สีเขียว)
                if (i <= currentStamps) {
                    slot.className = 'stamp-slot active';
                    slot.innerHTML = '⭐'; // ใส่ไอคอนดาวเมื่อมีแต้ม
                } else {
                    slot.className = 'stamp-slot';
                    slot.innerHTML = i; // ใส่ตัวเลขถ้ายังว่าง
                }
                grid.appendChild(slot);
            }
            
            // อัปเดตข้อความตัวเลข
            document.getElementById('statusText').innerText = `แต้มปัจจุบัน: ${currentStamps} / ${MAX_STAMPS}`;
        }

        // ฟังก์ชันเพิ่มแต้ม
        function addStamp() {
            if (currentStamps < MAX_STAMPS) {
                currentStamps++;
                localStorage.setItem('myRewardStamps', currentStamps); // บันทึกลงเบราว์เซอร์
                renderStamps();
                
                // แจ้งเตือนเมื่อแต้มครบ
                if (currentStamps === MAX_STAMPS) {
                    setTimeout(() => {
                        alert('ยินดีด้วย! คุณสะสมแต้มครบ 10 แต้มแล้ว มารับของรางวัลได้เลยครับ!');
                    }, 300);
                }
            } else {
                alert('คุณสะสมแต้มเต็มแล้ว! กรุณากดแลกรางวัลก่อนเริ่มรอบใหม่ครับ');
            }
        }

        // ฟังก์ชันแลกรางวัลและรีเซ็ตแต้ม
        function redeemReward() {
            if (currentStamps === 0) {
                alert('คุณยังไม่มีแต้มให้แลกรางวัลครับ');
                return;
            }
            
            if (confirm('ต้องการแลกของรางวัลและรีเซ็ตแต้มเป็น 0 ใช่หรือไม่?')) {
                currentStamps = 0;
                localStorage.setItem('myRewardStamps', currentStamps);
                renderStamps();
            }
        }

        // เรียกใช้งานฟังก์ชันวาดสแตมป์ครั้งแรกตอนเปิดหน้าเว็บ
        renderStamps();
    </script>

</body>
</html>
