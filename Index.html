<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App สะสมแต้ม (สแกน QR)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .reward-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .reward-card h2 { color: #333; margin-top: 0; }
        .reward-card p { color: #666; font-size: 14px; }
        
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 25px 0;
        }
        .stamp-slot {
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 2px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #cbd5e1;
            transition: all 0.3s ease;
        }
        .stamp-slot.active {
            background-color: #10b981;
            border-color: #10b981;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
            transform: scale(1.05);
        }
        .status-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .btn-scan { background-color: #3b82f6; color: white; }
        .btn-scan:hover { background-color: #2563eb; }
        .btn-cancel { background-color: #64748b; color: white; display: none; }
        .btn-redeem { background-color: #ef4444; color: white; margin-top: 20px;}
        
        /* ส่วนแสดงกล้อง */
        #reader {
            width: 100%;
            margin-bottom: 15px;
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อกดปุ่มสแกน */
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="reward-card">
        <h2>🎉 บัตรสะสมแต้ม</h2>
        <p>สแกน QR Code ที่จุดบริการเพื่อรับแต้ม</p>
        
        <div class="stamp-grid" id="stampGrid"></div>
        <div class="status-text" id="statusText">แต้มปัจจุบัน: 0 / 10</div>
        
        <div id="reader"></div>

        <button id="btnScan" class="btn-scan" onclick="startScan()">📷 เปิดกล้องสแกนรับแต้ม</button>
        <button id="btnCancel" class="btn-cancel" onclick="stopScan()">❌ ยกเลิกการสแกน</button>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <button class="btn-redeem" onclick="redeemReward()">🎁 แลกของรางวัล (เริ่มใหม่)</button>
    </div>

    <script>
        const MAX_STAMPS = 10;
        // กำหนด "รหัสลับ" ที่ซ่อนอยู่ใน QR Code
        const SECRET_QR_CODE = "STAMP_ME_2026"; 
        
        let currentStamps = parseInt(localStorage.getItem('myRewardStamps')) || 0;
        let html5QrCode;

        function renderStamps() {
            const grid = document.getElementById('stampGrid');
            grid.innerHTML = ''; 
            for (let i = 1; i <= MAX_STAMPS; i++) {
                const slot = document.createElement('div');
                if (i <= currentStamps) {
                    slot.className = 'stamp-slot active';
                    slot.innerHTML = '⭐';
                } else {
                    slot.className = 'stamp-slot';
                    slot.innerHTML = i;
                }
                grid.appendChild(slot);
            }
            document.getElementById('statusText').innerText = `แต้มปัจจุบัน: ${currentStamps} / ${MAX_STAMPS}`;
        }

        // --- ระบบสแกน QR Code ---
        function startScan() {
            if (currentStamps >= MAX_STAMPS) {
                alert('คุณสะสมแต้มเต็มแล้ว! กรุณากดแลกรางวัลก่อนครับ');
                return;
            }

            document.getElementById('reader').style.display = 'block';
            document.getElementById('btnScan').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");
            
            // เปิดกล้องหลัง (environment)
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    // เมื่อสแกนเจอข้อความ ให้ตรวจสอบว่าตรงกับรหัสลับไหม
                    if (decodedText === SECRET_QR_CODE) {
                        stopScan(); // ปิดกล้อง
                        addStamp(); // เพิ่มแต้ม
                        alert('รับแต้มสำเร็จ! 🎉');
                    } else {
                        stopScan();
                        alert('❌ QR Code ไม่ถูกต้อง ไม่สามารถรับแต้มได้ครับ');
                    }
                },
                (errorMessage) => {
                    // ละเว้น error ระหว่างกล้องกำลังมองหา QR Code
                }
            ).catch((err) => {
                alert(`ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้ใช้งานกล้องครับ\n(${err})`);
                stopScan();
            });
        }

        function stopScan() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnScan').style.display = 'block';
                    document.getElementById('btnCancel').style.display = 'none';
                }).catch(err => console.log(err));
            }
        }

        function addStamp() {
            currentStamps++;
            localStorage.setItem('myRewardStamps', currentStamps);
            renderStamps();
            
            if (currentStamps === MAX_STAMPS) {
                setTimeout(() => {
                    alert('ยินดีด้วย! คุณสะสมแต้มครบ 10 แต้มแล้ว มารับของรางวัลได้เลยครับ!');
                }, 500);
            }
        }

        function redeemReward() {
            if (currentStamps === 0) {
                alert('คุณยังไม่มีแต้มให้แลกรางวัลครับ');
                return;
            }
            if (confirm('ต้องการแลกของรางวัลและรีเซ็ตแต้มเป็น 0 ใช่หรือไม่?')) {
                currentStamps = 0;
                localStorage.setItem('myRewardStamps', currentStamps);
                renderStamps();
            }
        }

        renderStamps();
    </script>
</body>
</html>
