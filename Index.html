<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>300m Walking Quest</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1; /* ป้องกันแผนที่บัง UI */
        }
        #ui-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 1000; /* ให้อยู่เหนือแผนที่ */
            min-width: 250px;
        }
        .distance-text {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        .target-text {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        #start-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
        }
        #start-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-panel">
        <div class="distance-text"><span id="current-distance">0.00</span> / 300 m</div>
        <div class="target-text">ภารกิจ: เดินให้ครบ 300 เมตร</div>
        <button id="start-btn" onclick="startTracking()">เริ่มออกเดินทาง</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let watchId;
        let pathCoordinates = [];
        let polyline;
        let totalDistance = 0;
        let lastPosition = null;
        let userMarker = null;

        // ฟังก์ชันเริ่มต้นสร้างแผนที่ OpenStreetMap
        function initMap() {
            // ตั้งค่าเริ่มต้นที่กรุงเทพฯ
            map = L.map('map').setView([13.7563, 100.5018], 18);

            // โหลดแผนที่จาก OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // สร้างเส้นทาง (Polyline)
            polyline = L.polyline(pathCoordinates, {color: '#3498db', weight: 5}).addTo(map);
        }

        // เรียกใช้งานแผนที่ทันที
        initMap();

        function startTracking() {
            if (!navigator.geolocation) {
                alert("เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง");
                return;
            }

            document.getElementById("start-btn").innerText = "กำลังติดตามพิกัด...";
            document.getElementById("start-btn").disabled = true;

            watchId = navigator.geolocation.watchPosition(
                updatePosition, 
                handleError, 
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        function updatePosition(position) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const currentLoc = [currentLat, currentLng];

            // เลื่อนกล้องแผนที่ตามผู้ใช้
            map.setView(currentLoc, 18);

            // อัปเดต Marker ผู้เล่น
            if (!userMarker) {
                userMarker = L.circleMarker(currentLoc, {
                    radius: 8,
                    fillColor: "#e74c3c",
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(map);
            } else {
                userMarker.setLatLng(currentLoc);
            }

            if (lastPosition) {
                const distanceAdded = calculateDistanceInMeters(
                    lastPosition.lat, lastPosition.lng, 
                    currentLat, currentLng
                );
                
                // กรองค่า GPS ที่กระโดดเกินไป
                if (distanceAdded > 0.5) {
                    totalDistance += distanceAdded;
                    document.getElementById("current-distance").innerText = totalDistance.toFixed(2);
                    
                    pathCoordinates.push(currentLoc);
                    polyline.setLatLngs(pathCoordinates);
                }
            } else {
                pathCoordinates.push(currentLoc);
                polyline.setLatLngs(pathCoordinates);
            }

            lastPosition = { lat: currentLat, lng: currentLng };

            if (totalDistance >= 300) {
                navigator.geolocation.clearWatch(watchId);
                document.getElementById("start-btn").innerText = "ภารกิจสำเร็จ! 🎉";
                document.getElementById("start-btn").style.backgroundColor = "#f39c12";
                alert("ยินดีด้วย! คุณเดินสำรวจครบ 300 เมตรแล้ว");
            }
        }

        function calculateDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function handleError(error) {
            console.warn(`ERROR(${error.code}): ${error.message}`);
        }
    </script>
</body>
</html>
