<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสะสมแต้ม Event</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 18px; box-sizing: border-box; text-align: center; letter-spacing: 2px; margin-bottom: 15px;}
        
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 25px 0; }
        .stamp-slot { aspect-ratio: 1 / 1; border-radius: 15px; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #94a3b8; transition: all 0.2s; background: #f8fafc;}
        
        /* สไตล์สำหรับรูปภาพแสตมป์ */
        .stamp-img { 
            width: 45px; 
            height: 45px; 
            object-fit: contain; 
            margin-bottom: 5px; 
            transition: all 0.3s ease;
        }

        /* ตอนที่ยังไม่ได้แสตมป์ ให้รูปเป็นสีเทาและโปร่งแสงนิดๆ */
        .stamp-slot .stamp-img { 
            filter: grayscale(100%) opacity(40%); 
        }

        /* ตอนที่แสตมป์แล้ว (active) ให้เปลี่ยนสีพื้นหลังและแสดงรูปสีปกติ */
        .stamp-slot.active { 
            background-color: #f0fdf4; 
            border-color: #10b981; 
            color: #047857; 
            transform: scale(1.05); 
            box-shadow: 0 4px 6px rgba(16,185,129,0.15); 
            font-weight: bold;
        }
        .stamp-slot.active .stamp-img { 
            filter: none; 
        }
        
        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-redeem { background-color: #ef4444; color: white; margin-top: 15px;}
        .btn-redeem:disabled { background-color: #fca5a5; cursor: not-allowed; }
        .btn-lucky { background-color: #8b5cf6; color: white; margin-top: 15px; animation: pulse 2s infinite;}
        .btn-cancel { background-color: #64748b; color: white; display: none; }
        .btn-logout { background-color: #94a3b8; color: white; margin-top: 10px; font-size: 14px; padding: 8px;}
        
        #reader { width: 100%; margin-bottom: 15px; display: none; border-radius: 10px; overflow: hidden; }
        .hidden { display: none !important; }
        .user-info { background-color: #e2e8f0; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #475569; display: inline-block; margin-bottom: 10px; }
        .loading { font-style: italic; color: #3b82f6; display: none; margin-top: 10px; font-weight: bold; font-size: 14px;}
        
        .success-banner { background-color: #fef3c7; border: 2px solid #f59e0b; color: #d97706; padding: 20px; border-radius: 15px; margin: 20px 0; font-size: 18px; font-weight: bold;}
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <h2>🔐 เข้าสู่ระบบสะสมแต้ม</h2>
        <div class="input-group">
            <input type="tel" id="userCode" maxlength="10" placeholder="กรอกรหัส 10 หลัก" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <button id="btnLogin" class="btn-primary" onclick="login()">ตกลงเพื่อเข้าสู่ระบบ</button>
        <div id="loadingLogin" class="loading">⏳ กำลังเชื่อมต่อระบบ...</div>
    </div>

    <div class="container hidden" id="stampScreen">
        <h2>🎉 บัตรสะสมแต้ม</h2>
        <div class="user-info" id="displayUserCode">รหัสสมาชิก: XXXXXXXXXX</div>
        
        <div id="successBanner" class="success-banner hidden">
            🎁 รับของรางวัลเรียบร้อยแล้ว!<br><span style="font-size: 14px; color:#92400e;">(ไม่สามารถเล่นซ้ำได้)</span>
        </div>

        <div id="stampArea">
            <div class="stamp-grid" id="stampGrid"></div>
            <div id="statusText" style="font-weight: bold; margin-bottom: 15px;">แต้มปัจจุบัน: 0 / 10</div>
            
            <div id="reader"></div>
            <button id="btnScan" class="btn-primary" onclick="startScan()">📷 สแกน QR Code ฐาน</button>
            <button id="btnCancel" class="btn-cancel" onclick="stopScan()">❌ ยกเลิกสแกน</button>
            <div id="loadingAction" class="loading">⏳ กำลังบันทึกข้อมูล...</div>
            
            <button id="btnRedeem" class="btn-redeem" onclick="redeemReward()" disabled>🎁 แลกของรางวัล (ต้องครบ 10 ฐาน)</button>
        </div>
        
        <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <script>
        // ==========================================
        // 🎯 1. ตั้งค่า Firebase (เอาค่าจาก Project Settings มาใส่)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAl3zeSfVEFcCzH7f59xI4p2JIGRmKv84Q",
            authDomain: "test-c7a89.firebaseapp.com",
            projectId: "test-c7a89",
            storageBucket: "test-c7a89.firebasestorage.app",
            messagingSenderId: "991568384353",
            appId: "1:991568384353:web:a793fcb490810aac47b520",
            measurementId: "G-R3VS4FMDSX"
        };

        // เริ่มต้นการเชื่อมต่อ Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 🎯 2. ตั้งค่าข้อมูลฐาน และลิงก์รูปภาพแสตมป์
        // ==========================================
        const BASE_IMG_URL = "https://your-website.com/images/"; // เปลี่ยนเป็น URL โฟลเดอร์รูปของคุณ
        
        const STATIONS = [
            { id: 0, name: "ฐาน 1", qr: "QR_STN_01", img: BASE_IMG_URL + "stamp1.png" },
            { id: 1, name: "ฐาน 2", qr: "QR_STN_02", img: BASE_IMG_URL + "stamp2.png" },
            { id: 2, name: "ฐาน 3", qr: "QR_STN_03", img: BASE_IMG_URL + "stamp3.png" },
            { id: 3, name: "ฐาน 4", qr: "QR_STN_04", img: BASE_IMG_URL + "stamp4.png" },
            { id: 4, name: "ฐาน 5", qr: "QR_STN_05", img: BASE_IMG_URL + "stamp5.png" },
            { id: 5, name: "AIX",    qr: "QR_STN_06", img: BASE_IMG_URL + "aix_stamp.png" }, // ฐาน Chula AIX
            { id: 6, name: "ฐาน 7", qr: "QR_STN_07", img: BASE_IMG_URL + "stamp7.png" },
            { id: 7, name: "ฐาน 8", qr: "QR_STN_08", img: BASE_IMG_URL + "stamp8.png" },
            { id: 8, name: "ฐาน 9", qr: "QR_STN_09", img: BASE_IMG_URL + "stamp9.png" },
            { id: 9, name: "ฐาน 10", qr: "QR_STN_10", img: BASE_IMG_URL + "stamp10.png" }
        ];

        let currentUser = { code: "", stations: Array(10).fill(false), isRedeemed: false };
        let html5QrCode;

        // ระบบล็อกอิน ดึงข้อมูลจาก Firebase
        function login() {
            const input = document.getElementById('userCode').value;
            if (input.length !== 10) { alert("กรุณากรอกรหัสให้ครบ 10 หลัก"); return; }
            
            document.getElementById('loadingLogin').style.display = 'block';
            document.getElementById('btnLogin').disabled = true;

            // อ้างอิงไปยังตำแหน่งข้อมูลผู้ใช้ใน Firebase
            const userRef = db.ref('users/' + input);
            
            userRef.once('value', (snapshot) => {
                document.getElementById('loadingLogin').style.display = 'none';
                document.getElementById('btnLogin').disabled = false;

                if (snapshot.exists()) {
                    // ถ้ามีประวัติอยู่แล้ว ให้ดึงมาใช้
                    const data = snapshot.val();
                    currentUser.code = input;
                    currentUser.stations = data.stations || Array(10).fill(false);
                    currentUser.isRedeemed = data.isRedeemed || false;
                } else {
                    // ถ้าเป็นคนใหม่ ให้สร้างข้อมูลเริ่มต้นบน Firebase แบบ Realtime ทันที
                    currentUser = { code: input, stations: Array(10).fill(false), isRedeemed: false };
                    userRef.set(currentUser);
                }
                
                document.getElementById('displayUserCode').innerText = `รหัสสมาชิก: ${currentUser.code}`;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('stampScreen').classList.remove('hidden');
                renderUI();
            });
        }

        // วาดหน้าจอ UI
        function renderUI() {
            if (currentUser.isRedeemed) {
                document.getElementById('stampArea').classList.add('hidden');
                document.getElementById('successBanner').classList.remove('hidden');
                return;
            }

            const grid = document.getElementById('stampGrid');
            grid.innerHTML = ''; 
            let count = 0;

            STATIONS.forEach((st, index) => {
                const slot = document.createElement('div');
                const isPassed = currentUser.stations[index];
                
                if (isPassed) {
                    count++;
                    slot.className = 'stamp-slot active';
                } else {
                    slot.className = 'stamp-slot';
                }
                // ใช้รูปภาพแทนอีโมจิ
                slot.innerHTML = `<img src="${st.img}" class="stamp-img" alt="${st.name}" onerror="this.src='https://via.placeholder.com/45?text=Img'"><div>${st.name}</div>`;
                grid.appendChild(slot);
            });

            document.getElementById('statusText').innerText = count === 10 ? "🎉 เล่นครบ 10 ฐานแล้ว!" : `ผ่านแล้ว: ${count} / 10 ฐาน`;
            document.getElementById('btnRedeem').disabled = (count < 10);
            document.getElementById('btnScan').style.display = (count === 10) ? 'none' : 'block';
        }

        // ฟังก์ชันกล้อง
        function startScan() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btnScan').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 },
                (decodedText) => {
                    const matchedStation = STATIONS.find(s => s.qr === decodedText);
                    if (!matchedStation) {
                        alert("❌ QR Code ไม่ถูกต้อง ไม่ใช่ของกิจกรรมนี้");
                        stopScan(); return;
                    }
                    if (currentUser.stations[matchedStation.id]) {
                        alert(`⚠️ คุณผ่าน ${matchedStation.name} ไปแล้วครับ!`);
                        stopScan(); return;
                    }

                    stopScan();
                    processStamp(matchedStation);
                }, (err) => {}
            ).catch(err => { alert("เปิดกล้องไม่ได้"); stopScan(); });
        }

        function stopScan() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btnScan').style.display = 'block';
                    document.getElementById('btnCancel').style.display = 'none';
                }).catch(e => {});
            }
        }

        // ระบบบันทึกเข้า Firebase (ทำงานไวระดับเสี้ยววินาที)
        function processStamp(station) {
            document.getElementById('loadingAction').style.display = 'block';

            // อัปเดตเฉพาะช่องฐานที่สแกน
            const stationRef = db.ref(`users/${currentUser.code}/stations/${station.id}`);
            
            stationRef.set(true).then(() => {
                document.getElementById('loadingAction').style.display = 'none';
                currentUser.stations[station.id] = true; // อัปเดตข้อมูลบนเครื่อง
                renderUI(); // วาดหน้าจอใหม่ (รูปแสตมป์จะเปลี่ยนเป็นสีปกติ)
                // ไม่ต้องใช้ alert รบกวน UI จะเด้งโชว์เองว่าผ่านแล้ว
            }).catch((error) => {
                document.getElementById('loadingAction').style.display = 'none';
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่");
            });
        }

        // แลกรางวัล
        function redeemReward() {
            if (confirm("ต้องการกดแลกของรางวัลใช่หรือไม่? (ไม่สามารถย้อนกลับได้)")) {
                document.getElementById('btnRedeem').innerText = "กำลังดำเนินการ...";
                document.getElementById('btnRedeem').disabled = true;

                const redeemRef = db.ref(`users/${currentUser.code}/isRedeemed`);
                redeemRef.set(true).then(() => {
                    currentUser.isRedeemed = true;
                    renderUI(); 
                }).catch(() => {
                    alert("บันทึกไม่สำเร็จ");
                    document.getElementById('btnRedeem').innerText = "🎁 แลกของรางวัล (ต้องครบ 10 ฐาน)";
                    document.getElementById('btnRedeem').disabled = false;
                });
            }
        }

        function logout() {
            stopScan();
            currentUser = { code: "", stations: Array(10).fill(false), isRedeemed: false };
            document.getElementById('userCode').value = "";
            document.getElementById('stampScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
